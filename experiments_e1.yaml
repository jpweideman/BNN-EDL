# All runs of the thesis experiments chapter.
# Run: python run_experiments.py --file_name experiments_e1.yaml --runs 3
# The runner loops seeds (s0, s1, s2) and resolves pretrained_from per seed.
# Gamma prior defaults to sd = 20% of the mode: concentration 27,
# rate = 26 / mode. The _sd arms override both parameters.
# e1_fm_L100_shift_chainB starts from the next seed's checkpoint and is
# the second chain of the pooling diagnostic.

wandb_project: ebnn-thesis
seed: 0

experiments:

  # Fashion-MNIST: pretrains (also the deterministic baselines)
  e1_fm_pretrain_sgd:
    config: fashion_mnist_sgd

  e1_fm_pretrain_edl:
    config: fashion_mnist_edl

  # Fashion-MNIST: BNN
  e1_fm_bnn_T1_warm:
    config: fashion_mnist_categorical_bnn_sgld
    pretrained_from: e1_fm_pretrain_sgd
  e1_fm_bnn_T1_scratch:
    config: fashion_mnist_categorical_bnn_sgld
    overrides:
      - training.num_epochs=150
      - training.sampling.start_epoch=105

  # Fashion-MNIST: eBNN prior-mode grid, three starts
  e1_fm_L15_scratch:
    config: fashion_mnist_dirichlet_bnn_sgld
    overrides:
      - training.prior_fs.params.rate=1.73333
      - training.num_epochs=150
      - training.sampling.start_epoch=105
  e1_fm_L15_warm:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=1.73333
  e1_fm_L15_shift:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=1.73333
      - training.pretrained.match_prior_mode=true

  e1_fm_L30_scratch:
    config: fashion_mnist_dirichlet_bnn_sgld
    overrides:
      - training.prior_fs.params.rate=0.86667
      - training.num_epochs=150
      - training.sampling.start_epoch=105
  e1_fm_L30_warm:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.86667
  e1_fm_L30_shift:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.86667
      - training.pretrained.match_prior_mode=true

  e1_fm_L100_scratch:
    config: fashion_mnist_dirichlet_bnn_sgld
    overrides:
      - training.prior_fs.params.rate=0.26
      - training.num_epochs=150
      - training.sampling.start_epoch=105
  e1_fm_L100_warm:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.26
  e1_fm_L100_shift:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.26
      - training.pretrained.match_prior_mode=true

  e1_fm_L300_scratch:
    config: fashion_mnist_dirichlet_bnn_sgld
    overrides:
      - training.prior_fs.params.rate=0.086667
      - training.num_epochs=150
      - training.sampling.start_epoch=105
  e1_fm_L300_warm:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.086667
  e1_fm_L300_shift:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.086667
      - training.pretrained.match_prior_mode=true

  # Fashion-MNIST: second chain of the pooling diagnostic
  e1_fm_L100_shift_chainB:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    pretrained_from_next_seed: true
    overrides:
      - training.prior_fs.params.rate=0.26
      - training.pretrained.match_prior_mode=true

  # CIFAR-10: pretrains (also the deterministic baselines)
  e1_c10_pretrain_sgd:
    config: cifar10_sgd
  e1_c10_pretrain_edl:
    config: cifar10_edl

  # CIFAR-10: BNN
  e1_c10_bnn_T1_warm:
    config: cifar10_categorical_bnn_sgld
    pretrained_from: e1_c10_pretrain_sgd
  e1_c10_bnn_T1_scratch:
    config: cifar10_categorical_bnn_sgld
    overrides:
      - training.num_epochs=600
      - training.sampling.start_epoch=420

  # CIFAR-10: eBNN anchor
  e1_c10_L100_scratch:
    config: cifar10_dirichlet_bnn_sgld
    overrides:
      - training.prior_fs.params.rate=0.26
      - training.num_epochs=600
      - training.sampling.start_epoch=420
  e1_c10_L100_shift:
    config: cifar10_dirichlet_bnn_sgld
    pretrained_from: e1_c10_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.26
      - training.pretrained.match_prior_mode=true

  # No-prior reference arms
  e1_fm_noprior_warm:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs=null

  # Fashion-MNIST: prior-standard-deviation sweep at mode 100
  e1_fm_L100_sd1000_shift:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.concentration=1.1051
      - training.prior_fs.params.rate=0.00105
      - training.pretrained.match_prior_mode=true
  e1_fm_L100_sd60_shift:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.concentration=4.5584
      - training.prior_fs.params.rate=0.03558
      - training.pretrained.match_prior_mode=true
  e1_fm_L100_sd5_shift:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.concentration=401.9975
      - training.prior_fs.params.rate=4.00998
      - training.pretrained.match_prior_mode=true

  # CIFAR-10: remaining eBNN arms (modes 30 and 300, sd sweep)
  e1_c10_L100_warm:
    config: cifar10_dirichlet_bnn_sgld
    pretrained_from: e1_c10_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.26

  e1_c10_noprior_warm:
    config: cifar10_dirichlet_bnn_sgld
    pretrained_from: e1_c10_pretrain_edl
    overrides:
      - training.prior_fs=null

  e1_c10_L300_shift:
    config: cifar10_dirichlet_bnn_sgld
    pretrained_from: e1_c10_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.086667
      - training.pretrained.match_prior_mode=true

  e1_c10_L100_sd1000_shift:
    config: cifar10_dirichlet_bnn_sgld
    pretrained_from: e1_c10_pretrain_edl
    overrides:
      - training.prior_fs.params.concentration=1.1051
      - training.prior_fs.params.rate=0.00105
      - training.pretrained.match_prior_mode=true
  e1_c10_L100_sd60_shift:
    config: cifar10_dirichlet_bnn_sgld
    pretrained_from: e1_c10_pretrain_edl
    overrides:
      - training.prior_fs.params.concentration=4.5584
      - training.prior_fs.params.rate=0.03558
      - training.pretrained.match_prior_mode=true
  e1_c10_L100_sd5_shift:
    config: cifar10_dirichlet_bnn_sgld
    pretrained_from: e1_c10_pretrain_edl
    overrides:
      - training.prior_fs.params.concentration=401.9975
      - training.prior_fs.params.rate=4.00998
      - training.pretrained.match_prior_mode=true

  e1_c10_L30_warm:
    config: cifar10_dirichlet_bnn_sgld
    pretrained_from: e1_c10_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.86667
  e1_c10_L30_shift:
    config: cifar10_dirichlet_bnn_sgld
    pretrained_from: e1_c10_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.86667
      - training.pretrained.match_prior_mode=true

  e1_c10_L300_warm:
    config: cifar10_dirichlet_bnn_sgld
    pretrained_from: e1_c10_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.086667

  # Fashion-MNIST: matched-mode arm (prior mode at the checkpoint level)
  e1_fm_L58_warm:
    config: fashion_mnist_dirichlet_bnn_sgld
    pretrained_from: e1_fm_pretrain_edl
    overrides:
      - training.prior_fs.params.rate=0.4483
