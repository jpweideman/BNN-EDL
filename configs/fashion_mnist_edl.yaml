# Fashion-MNIST EDL: Dirichlet head trained with the log loss.
defaults:
  - datasets: fashion_mnist
  - model: resnet20_grayscale_dirichlet
  - training: edl
  - evaluation: edl_fashion_mnist
  - _self_

seed: 0

training:
  dataset: fashion_mnist_train_split
  checkpoint:
    dataset: fashion_mnist_val
