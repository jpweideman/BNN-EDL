# Tiny Fashion-MNIST group for smoke-testing the pipeline on CPU. Same entry
# names as fashion_mnist.yaml, so the e1_* presets work unchanged, but every
# split is cut to a few hundred images. Not for real experiments.

fashion_mnist_train_split:
  name: fashion_mnist
  source: train
  split:
    role: train
    val_fraction: 0.99   # keep 1% (600 images)
    seed: 0
  shuffle: true
  batch_size: 128
  num_workers: 2
  transforms:
    - name: to_tensor
    - name: normalize
      params:
        mean: [0.2860]
        std: [0.3530]

fashion_mnist_val:
  name: fashion_mnist
  source: train
  split:
    role: val
    val_fraction: 0.01   # 600 images
    seed: 0
  shuffle: false
  batch_size: 128
  num_workers: 2
  transforms:
    - name: to_tensor
    - name: normalize
      params:
        mean: [0.2860]
        std: [0.3530]

fashion_mnist_train_diagnostic:
  name: fashion_mnist
  source: train
  split:
    role: train
    val_fraction: 0.99
    seed: 0
  shuffle: false
  batch_size: 128
  num_workers: 2
  transforms:
    - name: to_tensor
    - name: normalize
      params:
        mean: [0.2860]
        std: [0.3530]

fashion_mnist_test:
  name: fashion_mnist
  source: test
  split:
    role: train
    val_fraction: 0.94   # keep 6% (600 images)
    seed: 0
  shuffle: false
  batch_size: 128
  num_workers: 2
  transforms:
    - name: to_tensor
    - name: normalize
      params:
        mean: [0.2860]
        std: [0.3530]
