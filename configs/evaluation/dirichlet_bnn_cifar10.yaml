# eBNN (Dirichlet head), CIFAR-10. Val at the snapshot interval for the
# convergence curve, train_diagnostic for realised alpha_0, test and OOD
# final-only.
cifar10_val:
  interval: 20
  metrics:
    - name: accuracy
    - name: bma_dirichlet_accuracy
    - name: vacuity
    - name: dirichlet_strength
    - name: bma_dirichlet_strength
    - name: dirichlet_nll
    - name: dirichlet_digamma_nll
    - name: bma_dirichlet_nll
    - name: bma_dirichlet_digamma_nll
    - name: dirichlet_brier_score
    - name: dirichlet_expected_brier
    - name: dirichlet_calibration_error
      params:
        num_classes: 10
        num_bins: 15
        norm: l1
    - name: bma_dirichlet_brier_score
    - name: bma_dirichlet_expected_brier
    - name: bma_dirichlet_calibration_error
      params:
        num_classes: 10
        num_bins: 15
        norm: l1
    - name: bma_dirichlet_predictive_entropy
    - name: bma_dirichlet_expected_entropy
    - name: bma_dirichlet_mutual_information
    - name: bma_dirichlet_predictive_variance
    - name: analytical_dirichlet_total_uncertainty
    - name: analytical_dirichlet_aleatoric_uncertainty
    - name: analytical_dirichlet_distributional_uncertainty
cifar10_train_diagnostic:
  interval: 20
  metrics:
    - name: dirichlet_strength
    - name: bma_dirichlet_strength
    - name: array_dump
      params:
        output_type: dirichlet
        store_snapshots: false
cifar10_test:
  interval: -1
  metrics:
    - name: accuracy
    - name: bma_dirichlet_accuracy
    - name: vacuity
    - name: dirichlet_strength
    - name: bma_dirichlet_strength
    - name: dirichlet_nll
    - name: dirichlet_digamma_nll
    - name: bma_dirichlet_nll
    - name: bma_dirichlet_digamma_nll
    - name: dirichlet_brier_score
    - name: dirichlet_expected_brier
    - name: dirichlet_calibration_error
      params:
        num_classes: 10
        num_bins: 15
        norm: l1
    - name: bma_dirichlet_brier_score
    - name: bma_dirichlet_expected_brier
    - name: bma_dirichlet_calibration_error
      params:
        num_classes: 10
        num_bins: 15
        norm: l1
    - name: bma_dirichlet_predictive_entropy
    - name: bma_dirichlet_expected_entropy
    - name: bma_dirichlet_mutual_information
    - name: bma_dirichlet_predictive_variance
    - name: analytical_dirichlet_total_uncertainty
    - name: analytical_dirichlet_aleatoric_uncertainty
    - name: analytical_dirichlet_distributional_uncertainty
    - name: array_dump
      params:
        output_type: dirichlet
svhn_ood:
  interval: -1
  metrics:
    - name: vacuity
    - name: dirichlet_strength
    - name: bma_dirichlet_strength
    - name: bma_dirichlet_mutual_information
    - name: bma_dirichlet_predictive_entropy
    - name: array_dump
      params:
        output_type: dirichlet
random_noise_ood:
  interval: -1
  metrics:
    - name: vacuity
    - name: dirichlet_strength
    - name: bma_dirichlet_strength
    - name: bma_dirichlet_mutual_information
    - name: bma_dirichlet_predictive_entropy
    - name: array_dump
      params:
        output_type: dirichlet
