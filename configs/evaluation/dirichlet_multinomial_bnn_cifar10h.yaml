# Dirichlet-multinomial eBNN, CIFAR-10H counts. Val logs the same metrics as
# test; its array dump lets the analysis rebuild the cumulative BMA curve
# offline. Test final-only. cifar10_train_holdout scores the label metrics on
# the 50,000 CIFAR-10 training images, which the count experiment never trains
# on.
cifar10h_val:
  interval: 20
  metrics:
    - name: count_accuracy
    - name: bma_dirichlet_count_accuracy
    - name: dirichlet_multinomial_count_nll
    - name: mean_matched_multinomial_count_nll
    - name: bma_dirichlet_multinomial_count_nll
    - name: bma_mean_matched_multinomial_count_nll
    - name: vacuity
    - name: dirichlet_strength
    - name: bma_dirichlet_strength
    - name: bma_dirichlet_predictive_entropy
    - name: bma_dirichlet_expected_entropy
    - name: bma_dirichlet_mutual_information
    - name: bma_dirichlet_predictive_variance
    - name: analytical_dirichlet_total_uncertainty
    - name: analytical_dirichlet_aleatoric_uncertainty
    - name: analytical_dirichlet_distributional_uncertainty
    - name: array_dump
      params:
        output_type: dirichlet
        target_type: counts
cifar10h_test:
  interval: -1
  metrics:
    - name: count_accuracy
    - name: bma_dirichlet_count_accuracy
    - name: dirichlet_multinomial_count_nll
    - name: mean_matched_multinomial_count_nll
    - name: bma_dirichlet_multinomial_count_nll
    - name: bma_mean_matched_multinomial_count_nll
    - name: vacuity
    - name: dirichlet_strength
    - name: bma_dirichlet_strength
    - name: bma_dirichlet_predictive_entropy
    - name: bma_dirichlet_expected_entropy
    - name: bma_dirichlet_mutual_information
    - name: bma_dirichlet_predictive_variance
    - name: analytical_dirichlet_total_uncertainty
    - name: analytical_dirichlet_aleatoric_uncertainty
    - name: analytical_dirichlet_distributional_uncertainty
    - name: array_dump
      params:
        output_type: dirichlet
        target_type: counts
cifar10_train_holdout:
  interval: -1
  metrics:
    - name: accuracy
    - name: bma_dirichlet_accuracy
    - name: vacuity
    - name: dirichlet_strength
    - name: bma_dirichlet_strength
    - name: dirichlet_nll
    - name: dirichlet_digamma_nll
    - name: bma_dirichlet_nll
    - name: bma_dirichlet_digamma_nll
    - name: dirichlet_brier_score
    - name: dirichlet_expected_brier
    - name: dirichlet_calibration_error
      params:
        num_classes: 10
        num_bins: 15
        norm: l1
    - name: bma_dirichlet_brier_score
    - name: bma_dirichlet_expected_brier
    - name: bma_dirichlet_calibration_error
      params:
        num_classes: 10
        num_bins: 15
        norm: l1
    - name: bma_dirichlet_predictive_entropy
    - name: bma_dirichlet_expected_entropy
    - name: bma_dirichlet_mutual_information
    - name: bma_dirichlet_predictive_variance
    - name: analytical_dirichlet_total_uncertainty
    - name: analytical_dirichlet_aleatoric_uncertainty
    - name: analytical_dirichlet_distributional_uncertainty
    - name: array_dump
      params:
        output_type: dirichlet
