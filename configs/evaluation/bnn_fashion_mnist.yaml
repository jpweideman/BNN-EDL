# Categorical BNN. Val at the snapshot interval for the convergence curve,
# test and OOD final-only over all snapshots.
fashion_mnist_val:
  interval: 5
  metrics:
    - name: accuracy
    - name: nll
    - name: bma_accuracy
    - name: bma_nll
fashion_mnist_test:
  interval: -1
  metrics:
    - name: accuracy
    - name: bma_accuracy
    - name: bma_nll
    - name: bma_brier_score
    - name: nll
    - name: brier_score
    - name: calibration_error
      params:
        num_classes: 10
        num_bins: 15
        norm: l1
    - name: bma_calibration_error
      params:
        num_classes: 10
        num_bins: 15
        norm: l1
    - name: bma_predictive_entropy
    - name: bma_expected_entropy
    - name: bma_mutual_information
    - name: bma_predictive_variance
    - name: array_dump
      params:
        output_type: softmax
mnist_ood:
  interval: -1
  metrics:
    - name: bma_predictive_entropy
    - name: bma_mutual_information
    - name: array_dump
      params:
        output_type: softmax
random_noise_ood:
  interval: -1
  metrics:
    - name: bma_predictive_entropy
    - name: bma_mutual_information
    - name: array_dump
      params:
        output_type: softmax
