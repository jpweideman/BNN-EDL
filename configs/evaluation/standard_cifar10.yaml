# Deterministic softmax baseline, CIFAR-10. Val every epoch for checkpoint
# test final-only with the per-input array dump.
cifar10_val:
  interval: 1
  metrics:
    - name: accuracy
    - name: nll
    - name: brier_score
    - name: calibration_error
      params:
        num_classes: 10
        num_bins: 15
        norm: l1
cifar10_test:
  interval: -1
  metrics:
    - name: accuracy
    - name: nll
    - name: brier_score
    - name: calibration_error
      params:
        num_classes: 10
        num_bins: 15
        norm: l1
    - name: array_dump
      params:
        output_type: softmax
