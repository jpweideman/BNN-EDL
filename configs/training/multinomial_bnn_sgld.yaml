num_epochs: 2400
device: auto

pretrained:
  enabled: false
  path: null

loss:
  name: multinomial_count_nll

likelihood:
  name: multinomial

prior:
  name: diagonal_normal
  params:
    sd: 1.0
    normalize: false

sampler:
  name: sgld
  params:
    lr: 0.0002
    temperature: 1.0

# 10 snapshots, counted back from the final epoch: 2220, 2240, ..., 2400
sampling:
  enabled: true
  start_epoch: 2220
  sample_interval: 20

checkpoint:
  enabled: false

early_stopping:
  enabled: false

wandb:
  enabled: true
  project: bnn-edl
  name: null
  log_interval: 20
